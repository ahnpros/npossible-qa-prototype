<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>링크 복구 확인 페이지</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; background: #f4f5f7; color: #222; padding: 40px 20px; }
  .box { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid #e3e5e8; border-radius: 10px; padding: 28px; }
  h1 { font-size: 19px; margin-bottom: 10px; }
  p { font-size: 14px; line-height: 1.7; color: #444; }
</style>
</head>
<body>
  <div class="box">
    <h1>링크가 복구된 결과물입니다</h1>
    <p>이 페이지는 검증에서 탈락한 출품작이 같은 출품작의 새 버전으로 다시 제출될 때,
    교체된 결과물 링크가 실제로 열리는지 확인하기 위한 페이지입니다.
    내용은 단순하지만, 열리는 링크라는 것 자체가 이 제출의 검증 대상입니다.</p>
  </div>
</body>
</html>
